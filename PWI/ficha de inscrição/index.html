<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Ficha de Inscrição</title>
</head>

<body>

    <main class="container">

        <!-- CABEÇALHO -->
        <header class="cabecalho">

            <div class="centro">
                <span>CENTRO</span>
                <strong>PAULA SOUZA</strong>
            </div>

            <div class="governo">
                <small>GOVERNO DO ESTADO</small>
                <strong>SÃO PAULO</strong>
            </div>

            <div class="etec">
                <strong>ETEC</strong>
                <span>MonSenhor Antônio Magliano</span>
            </div>

        </header>

        <!-- TÍTULO -->
        <div class="titulo-formulario">
            Ficha de Inscrição
        </div>

        <form id="FormCadastro">

            <!-- NOME -->
            <div class="linha nome">
                <label>Nome do Candidato</label>
                <input type="text" name="nome">
            </div>

            <!-- DATA / DOCUMENTO / CPF / SEXO -->
            <div class="linha linha-dados">

                <div class="campo data">
                    <label>Data de</label>
                    <input type="text" name="data">
                </div>

                <div class="campo documento">
                    <label>Documento de</label>
                    <input type="text" name="documento">
                </div>

                <div class="campo cpf">
                    <label>CPF</label>
                    <input type="text" name="cpf">
                </div>

                <div class="campo sexo">
                    <label>Sexo</label>

                    <div class="radios">
                        <label>
                            <input type="radio" name="sexo" value="M">
                            M
                        </label>

                        <label>
                            <input type="radio" name="sexo" value="F">
                            F
                        </label>
                    </div>
                </div>

                <div class="campo mao">
                    <label>
                        <input type="radio" name="mao" value="destro">
                        Destro
                    </label>

                    <label>
                        <input type="radio" name="mao" value="canhoto">
                        Canhoto
                    </label>
                </div>

            </div>

            <!-- ENDEREÇO -->
            <div class="linha endereco-titulo">
                Endereço
            </div>

            <div class="linha linha-endereco">

                <div class="campo endereco">
                    <label>Endereço (Rua/Avenida, Praça)</label>
                    <input type="text" name="endereco">
                </div>

                <div class="campo numero">
                    <label>Número</label>
                    <input type="text" name="numero">
                </div>

                <div class="campo complemento">
                    <label>Complemento</label>
                    <input type="text" name="complemento">
                </div>

            </div>

            <!-- BAIRRO / CIDADE / ESTADO -->
            <div class="linha linha-local">

                <div class="campo bairro">
                    <label>Bairro</label>
                    <input type="text" name="bairro">
                </div>

                <div class="campo cidade">
                    <label>Cidade</label>
                    <input type="text" name="cidade">
                </div>

                <div class="campo estado">
                    <label>Estado</label>
                    <select name="estado">
                        <option value="">Selecione...</option>
                        <option>AC</option>
                        <option>AL</option>
                        <option>AP</option>
                        <option>AM</option>
                        <option>BA</option>
                        <option>CE</option>
                        <option>DF</option>
                        <option>ES</option>
                        <option>GO</option>
                        <option>MA</option>
                        <option>MT</option>
                        <option>MS</option>
                        <option>MG</option>
                        <option>PA</option>
                        <option>PB</option>
                        <option>PR</option>
                        <option>PE</option>
                        <option>PI</option>
                        <option>RJ</option>
                        <option>RN</option>
                        <option>RS</option>
                        <option>RO</option>
                        <option>RR</option>
                        <option>SC</option>
                        <option>SP</option>
                        <option>SE</option>
                        <option>TO</option>
                    </select>
                </div>

            </div>

            <!-- CEP / TELEFONE / CELULAR / ESCOLA -->
            <div class="linha linha-contato">

                <div class="campo cep">
                    <label>CEP</label>
                    <input type="text" name="cep">
                </div>

                <div class="campo telefone">
                    <label>Telefone</label>
                    <input type="text" name="telefone">
                </div>

                <div class="campo celular">
                    <label>Celular</label>
                    <input type="text" name="celular">
                </div>

                <div class="escola">

                    <label>
                        <input type="radio" name="escola" value="publica">
                        Escola Pública
                    </label>

                    <label>
                        <input type="radio" name="escola" value="particular">
                        Escola Particular
                    </label>

                </div>

            </div>

            <!-- EMAIL / ANO / TREINEIRO -->
            <div class="linha linha-email">

                <div class="campo email">
                    <label>E-Mail</label>
                    <input type="email" name="email">
                </div>

                <div class="campo conclusao">
                    <label>Ano de conclusão do</label>
                    <input type="text" name="ano_conclusao">
                </div>

                <div class="treineiro">

                    <span>Treineiro</span>

                    <label>
                        <input type="radio" name="treineiro" value="sim">
                        Sim
                    </label>

                    <label>
                        <input type="radio" name="treineiro" value="nao">
                        Não
                    </label>

                </div>

            </div>

            <!-- NECESSIDADES ESPECIAIS -->
            <div class="necessidades">

                <div class="necessidades-titulo">
                    É Portador de Necessidades Especial?
                </div>

                <div class="checkboxes">

                    <label>
                        <input type="checkbox" name="deficiente_visual">
                        Deficiente Visual
                    </label>

                    <label>
                        <input type="checkbox" name="deficiente_auditivo">
                        Deficiente Auditivo
                    </label>

                    <label>
                        <input type="checkbox" name="deficiente_fisico">
                        Deficiente Físico
                    </label>

                    <label>
                        <input type="checkbox" name="multiplas">
                        Múltiplas Deficiências
                    </label>

                    <label>
                        <input type="checkbox" name="outros">
                        Outros:
                    </label>

                </div>

            </div>

            <!-- PARTE INFERIOR -->
            <div class="parte-inferior">

                <!-- CURSO -->
                <div class="curso">

                    <div class="curso-titulo">
                        Opção de Curso
                    </div>

                    <select name="curso">
                        <option value=""></option>
                        <option>Administração</option>
                        <option>Desenvolvimento de Sistemas</option>
                        <option>Enfermagem</option>
                        <option>Informática</option>
                    </select>

                    <div class="curso-verso">
                        Tabela de Curso no Verso.
                    </div>

                </div>

                <!-- AVISO -->
                <div class="atencao">

                    <strong>ATENÇÃO</strong>

                    <p>
                        Leia, preencha e recolha a taxa de
                    </p>

                    <b>
                        R$50,00 na tesouraria do ETEC.
                    </b>

                </div>

            </div>

            <!-- BOTÕES -->
            <div class="botoes">

                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
                <button type="button" onclick="window.print()">Imprimir</button>

            </div>

        </form>

    </main>

</body>
</html>
